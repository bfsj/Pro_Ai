[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-ai"
version = "0.2.0"
description = "Single-GPU LLM inference: controlled KV cache experiments, Triton RMSNorm and reproducible reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6,<3",
    "transformers==4.57.6",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
gpu = ["triton>=3.2,<4; platform_system == 'Linux'"]

[project.scripts]
inference-lab = "inference_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
