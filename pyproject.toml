[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-ai"
version = "0.1.0"
description = "A hands-on lab for single-GPU LLM decoding, KV cache and performance analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6,<3",
    "transformers==4.57.6",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
inference-lab = "inference_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
